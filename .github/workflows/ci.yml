name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @topshelf/flavor-graph typecheck
      - run: pnpm --filter @topshelf/design typecheck
      - run: pnpm --filter @topshelf/web typecheck
      - run: pnpm --filter @topshelf/web build

  api:
    name: API — lint + import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
      - run: uv python install 3.11
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run python -c "from app.main import app; assert app"
